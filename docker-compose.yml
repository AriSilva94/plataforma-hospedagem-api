name: plataforma-hospedagem

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hospedagem
      POSTGRES_USER: hospedagem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:v1.26
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    working_dir: /scripts
    volumes:
      - ./test/load:/scripts:ro
    environment:
      BASE_URL: ${K6_BASE_URL:-http://host.docker.internal:3030}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["run", "rooms-listing.k6.ts"]

volumes:
  postgres_data:
  redis_data:
